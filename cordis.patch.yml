# dsh-sidechat bundle patch
#
# `dsh.bundle.patch` layer of the published package: installing through the
# official CLI —
#
#   dsh plugin --profile <name> add @evylynn/dsh-sidechat
#
# — appends this single `insert` (one plugin row) to the bundle stack. No
# manual profile edits.
#
# Install order is dsh-annotation-core -> dsh-better-sidebar -> dsh-sidechat.
# This patch inserts only sidechat; both dependencies remain top-level peers.
- insert:
    - id: side-chat
      # Node-resolvable package name; must match package.json `name`.
      name: '@evylynn/dsh-sidechat'
